openapi: 3.1.0
info:
  title: Palantír API (walking skeleton)
  version: 0.1.0
  description: >
    API HTTP do walking skeleton (feature 001). As rotas /v1/channels/fake/* só existem com
    PALANTIR_FAKE_CHANNEL=true e nunca devem ser habilitadas fora do ambiente local e de teste.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Todos os componentes saudáveis.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Algum componente indisponível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /v1/channels/fake/inbound:
    post:
      operationId: postFakeInbound
      description: Injeta uma mensagem como se tivesse sido capturada em uma conversa. Idempotente por (conversationId, externalMessageId).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FakeInboundRequest" }
      responses:
        "202":
          description: Mensagem gravada e indexação enfileirada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "200":
          description: Mensagem já gravada anteriormente (duplicata).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestResponse" }
        "400":
          description: Corpo inválido pelo contrato.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Fonte inexistente ou não autorizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/channels/fake/agent:
    post:
      operationId: postFakeAgent
      description: Envia uma mensagem ao agente como o dono da conta de canal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FakeAgentRequest" }
      responses:
        "200":
          description: Pergunta processada.
          content:
            application/json:
              schema: { $ref: "./channel/agent-reply.schema.json" }
        "204":
          description: Sem resposta (remetente desconhecido num canal com política de silêncio).
        "400":
          description: Corpo inválido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Agente indisponível.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/channels/fake/outbox:
    get:
      operationId: getFakeOutbox
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Respostas entregues pelo adaptador fake, mais recente primeiro.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Outbox" }
    delete:
      operationId: deleteFakeOutbox
      responses:
        "204":
          description: Registro de respostas limpo.
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string, enum: [ok, fail, "off", pairing, connected, reconnecting, logged_out] }
    FakeInboundRequest:
      type: object
      additionalProperties: false
      required: [conversationId, externalMessageId, senderId, text, timestamp]
      properties:
        accountId: { type: string, minLength: 1, default: fake-operator }
        conversationId: { type: string, minLength: 1 }
        externalMessageId: { type: string, minLength: 1 }
        senderId: { type: string, minLength: 1 }
        senderName: { type: string }
        text: { type: string, minLength: 1, maxLength: 50000 }
        timestamp: { type: string, format: date-time }
    IngestResponse:
      type: object
      additionalProperties: false
      required: [outcome, messageId]
      properties:
        outcome: { type: string, enum: [accepted, duplicate, reconciled] }
        messageId: { type: string, format: uuid }
    FakeAgentRequest:
      type: object
      additionalProperties: false
      required: [senderAccountId]
      description: >-
        Mensagem ao agente. Sem os campos da feature 009, é texto digitado (o comportamento de antes); com eles,
        simula o encaminhado, a resposta citando, a legenda e o áudio mandado ao agente.
      properties:
        senderAccountId: { type: string, minLength: 1 }
        text: { type: string, minLength: 1, maxLength: 50000 }
        messageId: { type: string, minLength: 1, maxLength: 200, description: "Id externo; gerado quando ausente." }
        kind: { type: string, enum: [text, audio, image, document], default: text }
        isForwarded: { type: boolean, default: false }
        quotedMessageId: { type: string, minLength: 1, maxLength: 200 }
        caption: { type: string, minLength: 1, maxLength: 50000 }
        audioBase64: { type: string, minLength: 1, maxLength: 23000000, description: "Áudio Ogg, servido pelo fetchMedia do canal de teste." }
        durationSeconds: { type: number, minimum: 0 }
      allOf:
        - if: { properties: { kind: { const: text } } }
          then: { required: [text] }
    OutboxItem:
      type: object
      additionalProperties: false
      required: [destinationAccountId, reply, rendered, sentAt]
      properties:
        destinationAccountId: { type: string }
        reply: { $ref: "./channel/agent-reply.schema.json" }
        rendered: { type: string }
        sentAt: { type: string, format: date-time }
        media:
          description: Anexos da resposta como o canal de teste os entregou (contrato 1.4.0). Só tamanho e SHA-256, nunca os bytes.
          type: array
          items: { $ref: "#/components/schemas/OutboxMedia" }
    OutboxMedia:
      type: object
      additionalProperties: false
      required: [ref, kind, mimeType, sizeBytes, outcome]
      properties:
        ref: { type: string, format: uuid }
        kind: { type: string, enum: [audio] }
        mimeType: { type: string }
        sizeBytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        outcome: { type: string, enum: [sent, failed, missing] }
    Outbox:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OutboxItem" }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: { type: string }
        details:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              message: { type: string }
