# Regras de alerta (feature 003, D-18; feature 004, D-16: por papel da sessão). Sem Alertmanager no ambiente local: os alertas aparecem em
# http://localhost:9090/alerts e no painel "Palantír / WhatsApp".
groups:
  - name: palantir-whatsapp
    rules:
      - alert: WhatsAppLoggedOut
        expr: max by (role) (whatsapp_session_state{state="logged_out"}) == 1
        labels:
          severity: critical
        annotations:
          summary: O WhatsApp desconectou o número ({{ $labels.role }})
          description: Pareie de novo com npm run dev:whatsapp e leia o QR Code com o celular desse número (agent = chip do agente; capture = número de captura).
      - alert: WhatsAppReconnectingTooLong
        expr: max by (role) (whatsapp_session_state{state="reconnecting"}) == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: O número ({{ $labels.role }}) está reconectando há mais de 5 minutos
          description: Verifique a internet do computador e o celular do chip.
  - name: palantir-media
    # Feature 005 (D-20): fila de transcrição parada e motor fora do ar. Aparecem no painel "Palantír / Mídia".
    rules:
      - alert: TranscriptionQueueStalled
        expr: sum(media_queue_size{kind="audio"}) > 0 and sum(increase(media_processed_total{kind="audio"}[30m])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: A fila de transcrição não diminui há 30 minutos
          description: Há áudios esperando e nenhum foi processado. Confira se o worker está no ar (npm run dev:worker), se PALANTIR_TRANSCRIPTION=on e se o motor responde em http://127.0.0.1:8090/health.
      - alert: TranscriberDown
        expr: max(transcriber_up) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: O motor de transcrição não responde há 5 minutos
          description: Os áudios ficam guardados e pendentes. Rode npm run setup para subir o container do motor de novo.
  - name: palantir-gestao
    # Feature 006 (D-16): exclusão de fonte parada. Aparece no painel "Palantír / Gestão".
    rules:
      - alert: SourceDeletionStalled
        expr: max(source_deletion_oldest_seconds) > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Uma exclusão de conversa está em andamento há mais de 30 minutos
          description: A conversa já não aparece nas respostas, mas os dados ainda não foram apagados. Confira se o worker está no ar (npm run dev:worker) e se o armazenamento de mídia responde (npm run setup). A exclusão tenta de novo sozinha por até 34 h.
