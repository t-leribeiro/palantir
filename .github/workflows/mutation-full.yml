# Mutação completa (ADR-0015): toda a base, sem reaproveitar resultados, uma vez por semana e sob demanda.
# Renova o resultado incremental que os PRs e a main reaproveitam, para o incremental não acumular desvio.
name: mutation-full

on:
  schedule:
    - cron: "0 9 * * 1" # segunda, 6h em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-full
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation completa (≥ 60%)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run test:mutation -- --force
      - name: guardar o resultado incremental
        if: always() && hashFiles('reports/stryker-incremental.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: mutation-report-full, path: reports/mutation/, if-no-files-found: ignore }
